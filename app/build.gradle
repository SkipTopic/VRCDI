apply plugin: 'com.android.application'

android {
    namespace 'com.vrcdevicecheck.osc'
    // 本机 SDK 只有 platform 35 / build-tools 35.0.0
    compileSdk 35

    defaultConfig {
        applicationId "com.vrcdevicecheck.osc"
        // VRChat 移动端最低兼容 API 29（Android 10），本应用与之对齐
        minSdkVersion 29
        targetSdkVersion 30
        versionCode 139
        versionName "2.3.9 Omega"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// 源码里有中文字符串，必须显式指定 UTF-8，否则 Windows 下会编译出乱码
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

dependencies {
    // Shizuku：以 shell(uid 2000) 身份读取受 SELinux 限制的 sysfs / procfs 节点。
    implementation 'dev.rikka.shizuku:api:12.1.0'
    implementation 'dev.rikka.shizuku:provider:12.1.0'
    // Shizuku 的公开类上带 @RestrictTo 注解，编译期需要它才能消掉「未知枚举常量」警告；
    // compileOnly 不会进 APK，运行时不依赖 AndroidX。
    compileOnly 'androidx.annotation:annotation:1.2.0'

    testImplementation 'junit:junit:4.13.2'
}
